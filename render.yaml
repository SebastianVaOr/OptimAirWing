services:
  - type: web
    name: optimairwing-app
    runtime: docker
    repo: https://github.com/SebastianVaOr/OptimAirWing.git
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: optimairwing-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: optimairwing-redis
          property: connectionString
      - key: VITE_APP_URL
        value: https://optimairwing-app.onrender.com

  - type: worker
    name: optimairwing-worker
    runtime: docker
    repo: https://github.com/SebastianVaOr/OptimAirWing.git
    plan: starter
    dockerfilePath: ./Dockerfile
    startCommand: node dist/worker.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        fromService:
          type: web
          name: optimairwing-app
          property: envVars.JWT_SECRET
      - key: ADMIN_SECRET_KEY
        fromService:
          type: web
          name: optimairwing-app
          property: envVars.ADMIN_SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: optimairwing-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: optimairwing-redis
          property: connectionString

databases:
  - name: optimairwing-db
    plan: basic

redis:
  - name: optimairwing-redis
    plan: starter
