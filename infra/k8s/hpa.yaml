apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: optimairwing-api
  namespace: optimairwing
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: optimairwing-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: optimairwing-worker
  namespace: optimairwing
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: optimairwing-worker
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
