apiVersion: v1
kind: ConfigMap
metadata:
  name: optimairwing-config
  namespace: optimairwing
data:
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  CORS_ORIGINS: "https://optimairwing.app,https://api.optimairwing.app"
  VITE_APP_URL: "https://optimairwing.app"
  BACKUP_CRON: "0 */6 * * *"
  REDIS_HOST: "optimairwing-redis"
  REDIS_PORT: "6379"
  PGHOST: "optimairwing-postgres"
  PGPORT: "5432"
  PGDATABASE: "optimairwing"
